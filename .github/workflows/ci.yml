name: CI - PokeAPI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven        # ⚡ cacheia as dependências para o próximo push ser mais rápido

      - name: Compilar e rodar os testes
        run: mvn test         # só isso! Maven baixa o Gson, JUnit e roda tudo
